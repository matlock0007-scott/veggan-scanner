<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f27"><title>Vegan Scanner</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f8f3;color:#10251a}main{max-width:680px;margin:auto;padding:35px 18px;text-align:center}.logo{margin:40px auto 20px;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:#123f27;color:#fff;font-size:52px;font-weight:800}h1{font-size:38px}.sub{font-size:20px;color:#657068}button{width:100%;margin-top:30px;padding:20px;border:0;border-radius:16px;background:#123f27;color:#fff;font-size:20px;font-weight:750}#scanner{display:none;position:fixed;inset:0;background:#000;z-index:5}video{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 4px #000}.box{width:min(88vw,520px);height:240px;border:4px solid #fff;border-radius:24px}.hint{margin:18px;font-size:18px;font-weight:700}.cancel{width:auto;padding:14px 28px;background:#111c}#result{display:none;text-align:left;background:#fff;border-radius:24px;padding:24px;margin-top:30px}#result h2{text-align:center;font-size:34px}.product{text-align:center;font-size:22px;font-weight:700}.ingredients{background:#f1f3ed;border-radius:16px;padding:18px;line-height:1.5}footer{color:#929a94;margin-top:70px}</style></head><body><main><div class="logo">V</div><h1>Vegan Scanner</h1><div class="sub">Scan a food barcode and check whether the listed ingredients are vegan.</div><button id="scanBtn">Scan a barcode</button><section id="result"></section><footer>Fast • Simple • Plant-based</footer></main><div id="scanner"><video id="video" playsinline muted></video><div class="overlay"><h2>Scan the product barcode</h2><div class="box"></div><div class="hint">Hold the barcode steady inside the box</div><button class="cancel" id="cancel">Cancel</button></div></div><script>
const animalWords=["milk","whey","casein","caseinate","lactose","butter","cream","cheese","yogurt","yoghurt","egg","albumen","gelatin","gelatine","honey","beeswax","shellac","carmine","cochineal","lard","tallow","anchovy","anchovies","fish","oyster","shrimp","prawn","chicken","beef","pork","turkey","duck","lamb","mutton"];let stream,detector,timer;const $=x=>document.getElementById(x);
async function startScan(){if(!("BarcodeDetector" in window)){alert("Please use current Chrome on Android.");return}try{detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"]});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:"continuous"}]},audio:false});$("video").srcObject=stream;await $("video").play();$("scanner").style.display="block";const t=stream.getVideoTracks()[0];try{const c=t.getCapabilities?.();if(c?.focusMode?.includes("continuous"))await t.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}timer=setInterval(detect,220)}catch(e){alert("Camera could not start. Check Chrome camera permission.");stopScan()}}
async function detect(){if(!$("video").videoWidth)return;try{const c=await detector.detect($("video"));if(c.length){let code=c[0].rawValue;stopScan();lookup(code)}}catch(e){}}
function stopScan(){clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("scanner").style.display="none"}
function evaluate(p){const tags=(p.ingredients_analysis_tags||[]).map(x=>String(x).toLowerCase());if(tags.some(x=>x.includes("non-vegan")))return["NOT VEGAN","Open Food Facts flags one or more ingredients as non-vegan."];if(tags.some(x=>x.endsWith(":vegan")||x==="vegan"))return["VEGAN","The database identifies the listed ingredients as vegan."];const text=(p.ingredients_text||"").toLowerCase(),found=animalWords.filter(w=>text.includes(w));if(found.length)return["NOT VEGAN","Possible animal-derived ingredient(s): "+[...new Set(found)].join(", ")+"."];return["UNSURE","The database does not provide enough information to confirm this product is vegan."]}
async function lookup(code){const r=$("result");r.style.display="block";r.innerHTML="<h2>Checking…</h2>";try{const res=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+"?fields=product_name,brands,ingredients_text,ingredients_analysis_tags"),d=await res.json();if(!d.product){r.innerHTML="<h2>NOT FOUND</h2><p>Barcode "+esc(code)+" is not currently in the database.</p>"+again();return}const p=d.product,[s,detail]=evaluate(p);r.innerHTML="<h2>"+s+"</h2><p class=product>"+esc(p.product_name||"Unknown product")+"</p><p style=text-align:center>"+esc(p.brands||"")+"<br>Barcode: "+esc(code)+"</p><p>"+esc(detail)+"</p><div class=ingredients><b>Ingredients</b><br><br>"+esc(p.ingredients_text||"No ingredient list available.")+"</div>"+again()}catch(e){r.innerHTML="<h2>ERROR</h2><p>Couldn't reach the product database.</p>"+again()}}
function again(){return '<button onclick="startScan()">Scan another product</button>'}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}$("scanBtn").onclick=startScan;$("cancel").onclick=stopScan;</script></body></html>
