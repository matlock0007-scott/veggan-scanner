<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f27"><title>Vegan Scanner</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f8f3;color:#10251a}main{max-width:680px;margin:auto;padding:35px 18px;text-align:center}.logo{margin:40px auto 20px;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:#123f27;color:#fff;font-size:52px;font-weight:800}h1{font-size:38px}.sub{font-size:20px;color:#657068}button{width:100%;margin-top:30px;padding:20px;border:0;border-radius:16px;background:#123f27;color:#fff;font-size:20px;font-weight:750}#scanner{display:none;position:fixed;inset:0;background:#000;z-index:5}video{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 4px #000}.box{width:min(88vw,520px);height:240px;border:4px solid #fff;border-radius:24px}.hint{margin:18px;font-size:18px;font-weight:700}.cancel{width:auto;padding:14px 28px;background:#111c}#result{display:none;text-align:left;background:#fff;border-radius:24px;padding:24px;margin-top:30px}#result h2{text-align:center;font-size:34px}.product{text-align:center;font-size:22px;font-weight:700}.ingredients{background:#f1f3ed;border-radius:16px;padding:18px;line-height:1.5;overflow-wrap:anywhere}footer{color:#929a94;margin-top:70px}</style></head><body><main><div class="logo">V</div><h1>Vegan Scanner</h1><div class="sub">Scan a food barcode and check whether the listed ingredients are vegan.</div><button id="scanBtn">Scan a barcode</button><section id="result" aria-live="polite"></section><footer>Fast • Simple • Plant-based</footer></main><div id="scanner"><video id="video" playsinline muted></video><div class="overlay"><h2>Scan the product barcode</h2><div class="box"></div><div class="hint">Hold the barcode steady inside the box</div><button class="cancel" id="cancel">Cancel</button></div></div><script>
let stream,detector,timer,busy=false;const $=x=>document.getElementById(x);
async function startScan(){if(!('BarcodeDetector' in window)){alert('Barcode scanning is not supported in this browser. Try current Chrome on Android.');return}try{detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});$('video').srcObject=stream;await $('video').play();$('scanner').style.display='block';busy=false;timer=setInterval(detect,250)}catch(e){alert('Camera could not start. Check browser camera permission.');stopScan()}}
async function detect(){if(busy||!$('video').videoWidth)return;busy=true;try{const codes=await detector.detect($('video'));if(codes.length){const code=codes[0].rawValue;stopScan();lookup(code)}}catch(e){}finally{busy=false}}
function stopScan(){clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('scanner').style.display='none'}
const nonVegan=[['milk',/\b(?:cow'?s? milk|whole milk|skim(?:med)? milk|milk powder|milk solids|dairy milk|whey|casein(?:ate)?|lactose|buttermilk|milkfat)\b/i],['egg',/\b(?:eggs?|egg whites?|egg yolks?|albumen|ovalbumin)\b/i],['gelatin',/\bgelati[ne]\b/i],['honey',/\bhoney\b/i],['beeswax',/\bbeeswax\b/i],['shellac',/\bshellac\b/i],['carmine',/\b(?:carmine|cochineal|e120)\b/i],['animal fat',/\b(?:lard|tallow|beef fat|pork fat|chicken fat)\b/i],['seafood',/\b(?:anchov(?:y|ies)|oyster extract|fish sauce|shrimp|prawn)\b/i],['dairy cheese',/\b(?:cheddar|parmesan|mozzarella|dairy cheese)\b/i]];
const ambiguous=[['butter',/\bbutter\b/i],['cream',/\bcream\b/i],['cheese',/\bcheese\b/i],['yogurt',/\byogh?urt\b/i],['meat or poultry',/\b(?:chicken|beef|pork|turkey|duck|lamb|mutton|fish)\b/i],['potentially animal-derived additives',/\b(?:natural flavou?rs?|mono-? and diglycerides|mono-?diglycerides|vitamin d3|glycerin|glycerol|stearic acid|l-?cysteine)\b/i]];
const plantQualifier='(?:oat|soy|soya|almond|coconut|rice|pea|cashew|hazelnut|hemp|flax|sunflower|peanut|cocoa|shea|apple|vegan|plant[- ]based|dairy[- ]free|non[- ]dairy|imitation)';
function cleanPlantPhrases(s){return s.replace(new RegExp('\\b'+plantQualifier+'\\s+(?:milk|butter|cream|cheese|yogh?urt|chicken|beef|pork|fish|egg)\\b','gi'),'plant alternative').replace(/\b(?:peanut|almond|cashew|cocoa|shea|apple) butter\b/gi,'plant spread').replace(/\b(?:coconut|oat|soy|almond|cashew|rice) (?:milk|cream|yogh?urt)\b/gi,'plant alternative')}
function evaluate(p){
  const tags=(p.ingredients_analysis_tags||[]).map(x=>String(x).toLowerCase());
  const veganTag=tags.some(x=>x==='en:vegan'||x==='vegan');
  const nonTag=tags.some(x=>x==='en:non-vegan'||x==='non-vegan');
  const raw=p.ingredients_text||'';
  const cleaned=cleanPlantPhrases(raw);
  const certain=nonVegan.filter(([name,re])=>re.test(cleaned)).map(x=>x[0]);
  const possible=ambiguous.filter(([name,re])=>re.test(cleaned)).map(x=>x[0]);
  if(certain.length)return ['NOT VEGAN','Animal-derived ingredients detected: '+certain.join(', ')+'.'];
  if(nonTag)return ['NOT VEGAN','Database identifies this product as non-vegan. Verify against packaging.'];
  if(possible.length)return ['NEEDS VERIFICATION','Ingredient sources need verification: '+possible.join(', ')+'.'];
  if(veganTag)return ['VEGAN (DATABASE)','Database identifies the ingredients as vegan. Check current packaging.'];
  if(!raw.trim())return ['NEEDS VERIFICATION','No ingredient list available.'];
  return ['LIKELY VEGAN','No clearly animal-derived ingredients detected. Vegan status is not independently verified.'];
}

function again(){return '<button onclick="startScan()">Scan another product</button>'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('scanBtn').onclick=startScan;$('cancel').onclick=stopScan;
</script></body></html>
