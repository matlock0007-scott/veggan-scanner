
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123f27">
<title>Vegan Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:#f7f8f3;color:#10251a}
main{max-width:680px;margin:auto;padding:30px 18px;text-align:center}
.logo{margin:25px auto 15px;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:#123f27;color:white;font-size:52px;font-weight:800}
h1{font-size:36px}
.sub{font-size:18px;color:#657068}
button{width:100%;margin-top:18px;padding:18px;border:0;border-radius:15px;background:#123f27;color:white;font-size:19px;font-weight:700}
.secondary{background:#e2ebe4;color:#123f27}
input,textarea{width:100%;padding:13px;margin-top:10px;border:1px solid #9ba99f;border-radius:10px;font:inherit}
textarea{min-height:110px}
#scanner{display:none;position:fixed;inset:0;background:#000;z-index:5}
video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-shadow:0 1px 4px black}
.target{width:min(88vw,520px);height:230px;border:4px solid white;border-radius:24px}
.hint{margin:18px;font-size:18px;font-weight:700}
.cancel{width:auto;background:#222}
#result{display:none;text-align:left;background:white;border-radius:20px;padding:20px;margin-top:24px;overflow-wrap:anywhere}
#result h2{text-align:center;font-size:28px}
.status{font-size:22px;font-weight:800}
.ingredients{background:#f1f3ed;border-radius:14px;padding:15px;line-height:1.5;white-space:pre-wrap}
.note{font-size:14px;color:#4f6256}
footer{color:#929a94;margin-top:55px}
</style>
</head>
<body>
<main>
<div class="logo">V</div>
<h1>Vegan Scanner</h1>
<div class="sub">Scan food barcodes. Check ingredients and recorded vegan certifications.</div>
<button id="scanBtn">Scan a barcode</button>
<button class="secondary" id="manualBtn">Enter barcode manually</button>
<section id="manual" hidden>
<input id="barcode" inputmode="numeric" placeholder="Barcode numbers">
<button id="lookupBtn">Look up product</button>
</section>
<section id="result" aria-live="polite"></section>
<footer>Fast • Simple • Plant-based</footer>
</main>
<div id="scanner">
<video id="video" playsinline muted></video>
<div class="overlay">
<h2>Scan the product barcode</h2>
<div class="target"></div>
<div class="hint">Hold the barcode steady inside the box</div>
<button class="cancel" id="cancel">Cancel</button>
</div>
</div>
<script>
let stream,detector,timer,busy=false,lastProduct=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function startScan(){
 if(!('BarcodeDetector' in window)){
  alert('Use Chrome on Android, or enter the barcode manually.');
  return;
 }
 try{
  detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},
   audio:false
  });
  $('video').srcObject=stream;
  await $('video').play();
  $('scanner').style.display='block';
  busy=false;
  timer=setInterval(detect,250);
 }catch(e){
  stopScan();
  alert('Camera could not start. Check camera permission.');
 }
}
async function detect(){
 if(busy||!$('video').videoWidth)return;
 busy=true;
 try{
  const codes=await detector.detect($('video'));
  if(codes.length){
   const code=codes[0].rawValue;
   stopScan();
   lookup(code);
  }
 }catch(e){}finally{busy=false;}
}
function stopScan(){
 clearInterval(timer);
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;
 $('scanner').style.display='none';
}
const nonVegan=[
 ['dairy',/\b(?:milk|whey|casein(?:ate)?|lactose|buttermilk|milkfat|milk solids|milk powder|cheddar|parmesan|mozzarella|butter|cream|yogh?urt|cheese|ghee)\b/i],
 ['egg',/\b(?:eggs?|egg whites?|egg yolks?|albumen|ovalbumin)\b/i],
 ['gelatin',/\bgelati[ne]\b/i],
 ['honey',/\bhoney\b/i],
 ['beeswax',/\bbeeswax\b/i],
 ['shellac',/\bshellac\b/i],
 ['carmine',/\b(?:carmine|cochineal|e120)\b/i],
 ['animal fat',/\b(?:lard|tallow|beef fat|pork fat|chicken fat)\b/i],
 ['meat or seafood',/\b(?:anchov(?:y|ies)|oyster extract|fish sauce|shrimp|prawn|chicken|beef|pork|turkey|duck|lamb|mutton|fish)\b/i]
];
const uncertain=/\b(?:natural flavou?rs?|mono-? and diglycerides|mono-?diglycerides|vitamin d3|glycerin|glycerol|stearic acid|l-?cysteine)\b/i;
const plantWords='(?:oat|soy|soya|almond|coconut|rice|pea|cashew|hazelnut|hemp|flax|sunflower|peanut|cocoa|shea|apple|vegan|plant[- ]based|dairy[- ]free|non[- ]dairy|imitation)';
function cleanPlant(s){
 return s.replace(
  new RegExp('\\b'+plantWords+'\\s+(?:milk|butter|cream|cheese|yogh?urt|chicken|beef|pork|fish|egg)\\b','gi'),
  'plant alternative'
 ).replace(/\b(?:peanut|almond|cashew|cocoa|shea|apple) butter\b/gi,'plant spread');
}
function classify(p,manual){
 const raw=(manual===undefined?p.ingredients_text:manual)||'';
 const tags=(p.ingredients_analysis_tags||[]).map(x=>String(x).toLowerCase());
 const labels=(p.labels_tags||[]).map(x=>String(x).toLowerCase());
 const labelText=String(p.labels||'');
 const certified=labels.some(x=>/^(?:en:)?(?:vegan|certified-vegan|vegan-society|v-label-vegan|vegetarian-society-vegan-approved)$/.test(x))
 ||/\b(?:certified vegan|vegan approved|vegetarian society vegan approved)\b/i.test(labelText);
 const veganTag=tags.includes('en:vegan')||tags.includes('vegan');
 const nonTag=tags.includes('en:non-vegan')||tags.includes('non-vegan');
 const cleaned=cleanPlant(raw);
 const detected=nonVegan.filter(([,re])=>re.test(cleaned)).map(([name])=>name);
 if(detected.length)
  return ['POSSIBLY NOT VEGAN','Potential animal ingredients detected: '+detected.join(', ')+'. Check for plant-based substitutes and packaging details.'];
 if(nonTag)
  return ['NOT VEGAN (DATABASE)','The database classifies this product as non-vegan. Check the current package.'];
 if(certified)
  return ['VEGAN (LABEL RECORDED)','The product database records a vegan label or certification. Confirm it on your package.'];
 if(!raw.trim())
  return ['NEEDS VERIFICATION','No ingredient list is available from the product database. You can enter the package ingredients below.'];
 if(veganTag)
  return ['VEGAN (DATABASE)','The database classifies the ingredients as vegan. Check the current package.'];
 if(uncertain.test(cleaned))
  return ['NEEDS VERIFICATION','Some ingredients may have plant or animal origins. Check with the manufacturer.'];
 return ['NEEDS VERIFICATION','No obvious animal ingredients detected, but this does not prove the product is vegan.'];
}
function showProduct(p,code,manual){
 lastProduct={p,code};
 const [status,reason]=classify(p,manual);
 const raw=manual===undefined?p.ingredients_text:manual;
 $('result').innerHTML=
  '<h2>'+esc(p.product_name||'Unknown product')+'</h2>'+
  '<p class="status">'+esc(status)+'</p>'+
  '<p>'+esc(reason)+'</p>'+
  '<h3>Ingredients</h3>'+
  '<div class="ingredients">'+esc(raw||'Not available')+'</div>'+
  '<p class="note">Source: Open Food Facts, a community-maintained database. “Plant-based” and “dairy-free” alone do not prove vegan status.</p>'+
  '<h3>Ingredients missing or incorrect?</h3>'+
  '<p>Enter the ingredients printed on the package to check them. This does not update the database.</p>'+
  '<textarea id="ingredientEntry" placeholder="Type or paste ingredients here">'+esc(manual||'')+'</textarea>'+
  '<button class="secondary" id="checkIngredients">Check entered ingredients</button>'+
  '<button id="again">Scan another product</button>';
 $('checkIngredients').onclick=()=>{
  const entered=$('ingredientEntry').value.trim();
  if(!entered){
   alert('Enter the ingredients first.');
   return;
  }
  showProduct(p,code,entered);
 };
 $('again').onclick=startScan;
}
async function lookup(code){
 code=String(code).trim();
 if(!/^\d{8,14}$/.test(code)){
  alert('Enter an 8 to 14 digit barcode.');
  return;
 }
 $('result').style.display='block';
 $('result').innerHTML='<h2>Looking up product...</h2>';
 try{
  const response=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json',{cache:'no-store'});
  if(!response.ok)throw Error('Lookup failed');
  const data=await response.json();
  if(!data.product||data.status===0){
   $('result').innerHTML='<h2>Product not found</h2><p>Try another barcode.</p>';
   return;
  }
  showProduct(data.product,code);
 }catch(e){
  $('result').innerHTML='<h2>Product lookup failed</h2><p>Check your connection and try again.</p>';
 }
}
$('scanBtn').onclick=startScan;
$('cancel').onclick=stopScan;
$('manualBtn').onclick=()=>$('manual').hidden=!$('manual').hidden;
$('lookupBtn').onclick=()=>lookup($('barcode').value);
</script>
</body>
</html>
